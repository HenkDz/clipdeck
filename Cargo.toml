[package]
name = "clipdeck"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui-component = "=0.9.0"
gpui-windows = { package = "gpui-pre-windows", version = "=0.3.11" }
global-hotkey = "0.7"
async-channel = "2"
raw-window-handle = "0.6"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi"] }

