[package]
name = "clipdeck"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui-component = "=0.9.0"
gpui-kit-assets = "=0.9.0"
gpui-windows = { package = "gpui-pre-windows", version = "=0.3.11" }
global-hotkey = "0.7"
async-channel = "2"
raw-window-handle = "0.6"
rusqlite = { version = "0.38", features = ["bundled"] }
tray-icon = "0.21"
toml = "1.1"
dirs = "6"
sha2 = "0.11.1"
image = { version = "=0.25.10", default-features = false, features = ["bmp", "png"] }
windows = { version = "0.61", features = ["Win32_Graphics_Dwm", "Win32_System_Com", "Win32_UI_Shell_PropertiesSystem", "Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_System_ProcessStatus", "Win32_Security", "Win32_System_Registry", "Win32_System_Time", "Win32_System_SystemInformation"] }

